<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Подробнее</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      flex-direction: column;
      gap: 20px;
    }

    .photo-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100vh;
      padding: 24px;
    }

    .photo-wrapper img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.12);
    }

    .back-link {
      position: fixed;
      top: 20px;
      left: 20px;
    }
  </style>
</head>
<body>
  <a href="index.html" class="btn btn-outline back-link">← Назад</a>

  <div class="photo-wrapper">
    <img
      src="https://ifwbvpbwtdbgtpeyjsqk.supabase.co/storage/v1/object/public/avatars/unnamed.png"
      alt="Фотография"
    />
  </div>
</body>
</html>
